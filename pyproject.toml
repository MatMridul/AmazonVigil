[project]
name = "amazon-vigil"
version = "0.1.0"
description = "Amazon Vigil: autonomous multi-device perimeter defense & deterrence mesh (Alexa+ MCP server)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.0.0,<2.0.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "boto3>=1.34.0",
    "pydantic>=2.6.0",
    "httpx>=0.27.0",
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    "pillow>=10.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["error"]
