[project]
name = "amazon-vigil"
version = "0.1.0"
description = "Amazon Vigil: autonomous multi-device perimeter defense & deterrence mesh (Alexa+ MCP server)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.0.0,<2.0.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "boto3>=1.34.0",
    "pydantic>=2.6.0",
    "httpx>=0.27.0",
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    "pillow>=10.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.9.0",
    "mypy>=1.13.0",
    "pip-audit>=2.7.0",
    "pre-commit>=4.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["error"]

# SEC.6 — lint (incl. bandit S-rules that catch many AI-code vulns), isort, bugbear.
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "S", "UP"]
# S101 (assert) is fine in tests; S311 (non-crypto random) N/A — we use secrets.
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
warn_unused_ignores = true
warn_redundant_casts = true
# SEC.6: tighten toward --strict incrementally; start non-strict so CI is adoptable.
ignore_missing_imports = true

[tool.coverage.run]
source = ["src"]
omit = ["src/web/static/*"]
